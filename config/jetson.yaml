# Jetson Configuration
# For Jetson Nano/Xavier/Orin with serial connection to FC

connection:
  device: "/dev/ttyTHS1"
  baud: 921600
  source_system: 1
  source_component: 191

monitoring:
  rate_hz: 1.0
  disk_path: "/"

# Processes to monitor; list order defines the CCH_SVC_MASK bit positions
services: []

platform: "jetson"

thresholds:
  temp_throttle_c: 75.0
  temp_overheat_c: 85.0
  memory_low_pct: 85
  disk_low_pct: 90
