# Raspberry Pi Configuration
# For RPi 3/4/5 connected to the FC over USB.
# Prefer the /dev/serial/by-id/ path for your board: numbered names like
# /dev/ttyACM0 depend on USB enumeration order.
# GPIO UART (/dev/ttyAMA0 at 921600) is not yet tested on hardware.

connection:
  device: "/dev/ttyACM0"
  baud: 115200
  source_system: 1
  source_component: 191

monitoring:
  rate_hz: 1.0
  disk_path: "/"

# Processes to monitor; list order defines the CCH_SVC_MASK bit positions
services: []

platform: "raspberry_pi"

thresholds:
  temp_throttle_c: 70.0   # Pi throttles at 80C
  temp_overheat_c: 80.0
  memory_low_pct: 85
  disk_low_pct: 90
