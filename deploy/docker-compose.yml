version: '3.8'

services:
  companion-health:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: companion-health:latest
    container_name: companion-health
    restart: unless-stopped

    # Network mode: host for direct UDP/serial access
    network_mode: host

    # Privileged mode for /sys and serial device access
    privileged: true

    # Mount points
    volumes:
      # System info (read-only for temperature sensors)
      - /sys:/sys:ro
      # Device access for serial connections
      - /dev:/dev

    # Environment
    environment:
      - MAVLINK20=1
      - PYTHONUNBUFFERED=1

    # Change the device for your setup; /dev/serial/by-id/ paths are stable
    # across reboots, numbered names like /dev/ttyACM0 are not
    command: ["--device", "/dev/ttyACM0", "--verbose"]

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import companion_health; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
