[General]
# Main Router Configuration (USB)

[UartEndpoint FC]
# Prefer a /dev/serial/by-id/ path here, numbered names depend on
# USB enumeration order
Device = /dev/ttyACM0
Baud = 115200

# Endpoint 1: Health Monitor Script
[UdpEndpoint HealthMonitor]
Mode = Normal
Address = 127.0.0.1
Port = 14551

# Endpoint 2: MAVROS or DroneKit
[UdpEndpoint App2]
Mode = Normal
Address = 127.0.0.1
Port = 14552

# Endpoint 3: Vision / AI System
[UdpEndpoint App3]
Mode = Normal
Address = 127.0.0.1
Port = 14553
